# SonarQube / SonarScanner CLI configuration for MediTrack.
#
# MediTrack has no build tool by design, so analysis runs through the standalone
# sonar-scanner CLI against pre-compiled classes rather than a Maven or Gradle
# plugin. Compile first, then scan:
#
#   javac -encoding UTF-8 -d out $(find src/main/java -name "*.java")
#   java -javaagent:.local/tools/org.jacoco.agent-0.8.12-runtime.jar=destfile=.local/jacoco.exec \
#        -cp out com.airtribe.meditrack.Main --runTests
#   java -jar .local/tools/org.jacoco.cli-0.8.12-nodeps.jar report .local/jacoco.exec \
#        --classfiles out --sourcefiles src/main/java --xml coverage/jacoco.xml
#   sonar-scanner -Dsonar.token=$SONAR_TOKEN
#
# See docs/CODE_QUALITY.md for the full workflow and the current results.

sonar.projectKey=meditrack
sonar.projectName=MediTrack
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.sourceEncoding=UTF-8

# Pre-compiled bytecode. Sonar's Java analyser needs this for type resolution;
# without it most rules silently downgrade to syntax-only checks.
sonar.java.binaries=out
sonar.java.source=21

# JaCoCo report produced by the CLI step above.
sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco.xml

# TestRunner lives under src/main/java because the project ships as a single
# source tree with no test source root. It is test scaffolding, not production
# code, so it is excluded from coverage requirements while still being analysed
# for genuine defects.
sonar.coverage.exclusions=\
  src/main/java/com/airtribe/meditrack/test/**,\
  src/main/java/com/airtribe/meditrack/util/DemoDataSeeder.java

sonar.host.url=http://localhost:9000
